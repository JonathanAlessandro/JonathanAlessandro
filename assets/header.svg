<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" role="img" aria-label="Olá, prazer, sou Jonathan!" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .ring { fill: none; stroke: #B8C2CC; stroke-width: 1.5; opacity: 0;
            transform-box: fill-box; transform-origin: center;
            animation: ripple 5s ease-out infinite; }
    @keyframes ripple {
      0%   { transform: scale(0.05); opacity: 0.9; }
      100% { transform: scale(1);    opacity: 0; }
    }
    .wave { transform-box: fill-box; transform-origin: 70% 70%;
            animation: wave 2.6s ease-in-out infinite; }
    @keyframes wave {
      0%, 60%, 100% { transform: rotate(0deg); }
      10% { transform: rotate(14deg); }
      20% { transform: rotate(-8deg); }
      30% { transform: rotate(14deg); }
      40% { transform: rotate(-4deg); }
      50% { transform: rotate(10deg); }
    }
    .hello { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
             font-size: 34px; font-weight: 700; fill: #111827; }
    .emoji { font-size: 38px; }
    @media (prefers-reduced-motion: reduce) {
      .ring { animation: none; opacity: 0.35; transform: scale(0.7); }
      .wave { animation: none; }
    }
  </style>

  <defs>
    <clipPath id="type">
      <rect x="125" y="50" width="0" height="80">
        <animate attributeName="width" begin="0.4s" dur="2.8s" fill="freeze" calcMode="discrete"
                 values="0;20.4;40.8;61.2;81.6;102;122.4;142.8;163.2;183.6;204;224.4;244.8;265.2;285.6;306;326.4;346.8;367.2;387.6;408;428.4;448.8;469.2;489.6;510;530.4;640"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="900" height="180" fill="#FDFDFC"/>

  <g>
    <circle class="ring" cx="690" cy="55"  r="80" style="animation-delay:0s"/>
    <circle class="ring" cx="690" cy="55"  r="80" style="animation-delay:1.7s"/>
    <circle class="ring" cx="690" cy="55"  r="80" style="animation-delay:3.4s"/>
    <circle cx="690" cy="55" r="3" fill="#B8C2CC"/>

    <circle class="ring" cx="820" cy="130" r="65" style="animation-delay:0.9s"/>
    <circle class="ring" cx="820" cy="130" r="65" style="animation-delay:2.6s"/>
    <circle class="ring" cx="820" cy="130" r="65" style="animation-delay:4.3s"/>
    <circle cx="820" cy="130" r="3" fill="#B8C2CC"/>

    <circle class="ring" cx="560" cy="145" r="55" style="animation-delay:2s"/>
    <circle class="ring" cx="560" cy="145" r="55" style="animation-delay:3.7s"/>
    <circle cx="560" cy="145" r="3" fill="#B8C2CC"/>

    <circle class="ring" cx="860" cy="30" r="45" style="animation-delay:1.3s"/>
    <circle class="ring" cx="860" cy="30" r="45" style="animation-delay:3s"/>
    <circle cx="860" cy="30" r="3" fill="#B8C2CC"/>
  </g>

  <text class="emoji wave" x="60" y="106">👋</text>
  <text class="hello" x="125" y="106" clip-path="url(#type)">Olá, prazer, sou Jonathan!</text>
</svg>