<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Jonathan Alessandro — Full-stack, IA e automação</title>
  <desc id="desc">Banner escuro com detalhes em verde e azul e um diagrama de conexões entre código, dados e aplicações.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#14253b"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#cbd5e1" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="24" fill="url(#grid)"/>
  <rect x="52" y="61" width="42" height="4" rx="2" fill="url(#accent)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="52" y="105" fill="#5eead4" font-size="16" font-weight="600" letter-spacing="3">CÓDIGO QUE CONECTA</text>
    <text x="48" y="169" fill="#f8fafc" font-size="52" font-weight="700">Jonathan Alessandro</text>
    <text x="52" y="213" fill="#cbd5e1" font-size="23">Full-stack · IA aplicada · Automação</text>
    <text x="52" y="272" fill="#94a3b8" font-size="17">Web, mobile, APIs e dados — do problema à solução.</text>
  </g>
  <g fill="none" stroke="url(#accent)" stroke-width="2" opacity=".65">
    <path d="M860 96L1018 74L1092 173L997 265L836 240L860 96ZM860 96L997 265M1018 74L836 240M836 240L1092 173"/>
  </g>
  <g fill="#14253b" stroke="#5eead4" stroke-width="2">
    <circle cx="860" cy="96" r="12"/><circle cx="1018" cy="74" r="9"/><circle cx="1092" cy="173" r="12"/><circle cx="997" cy="265" r="9"/><circle cx="836" cy="240" r="9"/>
  </g>
  <rect x="900" y="131" width="118" height="74" rx="16" fill="#0b1220" stroke="#60a5fa" stroke-opacity=".65"/>
  <text x="959" y="180" text-anchor="middle" font-family="Consolas, monospace" font-size="36" font-weight="700" fill="#5eead4">&lt;/&gt;</text>
  <rect x="52" y="314" width="1096" height="2" rx="1" fill="url(#accent)" opacity=".4"/>
